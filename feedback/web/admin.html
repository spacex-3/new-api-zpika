<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>反馈管理</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="admin-body">
    <main id="login-view" class="login-shell">
      <form id="login-form" class="login-panel">
        <p class="brand">ZPIKA</p>
        <h1>反馈管理</h1>
        <p>使用管理员口令登录。</p>
        <div class="field">
          <label for="admin-token">管理员口令</label>
          <input id="admin-token" type="password" autocomplete="current-password" required />
        </div>
        <button id="login-button" type="submit">登录</button>
        <p id="login-error" class="field-error"></p>
      </form>
    </main>

    <div id="admin-view" class="admin-shell" hidden>
      <header class="admin-header">
        <div>
          <p class="brand">ZPIKA</p>
          <h1>反馈管理</h1>
        </div>
        <button id="logout-button" type="button" class="secondary-button">退出</button>
      </header>

      <nav class="admin-tabs" aria-label="后台功能">
        <button type="button" data-tab="feedbacks" class="active">反馈列表</button>
        <button type="button" data-tab="settings">通知设置</button>
      </nav>

      <section id="feedbacks-tab" class="admin-section">
        <div class="toolbar">
          <div>
            <h2>反馈列表</h2>
            <p id="feedback-summary">正在载入...</p>
          </div>
          <select id="status-filter" aria-label="筛选反馈状态">
            <option value="all">全部状态</option>
            <option value="new">待处理</option>
            <option value="processing">处理中</option>
            <option value="resolved">已解决</option>
          </select>
        </div>
        <div id="feedback-list" class="feedback-list"></div>
      </section>

      <section id="settings-tab" class="admin-section" hidden>
        <div class="settings-panel">
          <div>
            <h2>Bark 通知</h2>
            <p>新反馈和客户追问会把联系邮箱及内容立即推送到此地址。</p>
          </div>
          <form id="settings-form">
            <div class="field">
              <label for="bark-url">Bark URL</label>
              <input id="bark-url" type="url" autocomplete="off" placeholder="https://api.day.app/你的密钥" />
              <p class="field-hint">也支持包含 <code>{{title}}</code> 和 <code>{{content}}</code> 的 URL 模板。留空可关闭通知。</p>
            </div>
            <div class="button-row">
              <button id="save-settings" type="submit">保存</button>
              <button id="test-notification" type="button" class="secondary-button">发送测试通知</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/assets/admin.js" defer></script>
  </body>
</html>
