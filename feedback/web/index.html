<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>留言反馈</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="public-shell">
      <header class="public-header">
        <p class="brand">ZPIKA</p>
        <h1>留言反馈</h1>
        <p>遇到问题或有改进建议，可以直接告诉我们。</p>
      </header>

      <section class="feedback-panel" aria-labelledby="feedback-title">
        <div class="section-heading">
          <div>
            <h2 id="feedback-title">提交反馈</h2>
            <p>邮箱用于必要时联系你，不会在页面公开。</p>
          </div>
          <span class="status-dot" aria-hidden="true"></span>
        </div>

        <form id="feedback-form" novalidate>
          <div class="field">
            <label for="email">联系邮箱</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="name@example.com" />
            <p class="field-error" id="email-error"></p>
          </div>
          <div class="field">
            <div class="field-label-row">
              <label for="content">反馈内容</label>
              <span id="content-count">0 / 4000</span>
            </div>
            <textarea id="content" name="content" minlength="10" maxlength="4000" required placeholder="请描述遇到的问题、使用场景或建议。"></textarea>
            <p class="field-error" id="content-error"></p>
          </div>
          <div class="honeypot" aria-hidden="true">
            <label for="website">网站</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <div class="form-footer">
            <p>提交后会立即通知管理员。</p>
            <button id="submit-button" type="submit">提交反馈</button>
          </div>
        </form>

        <div id="success-state" class="success-state" hidden>
          <div class="success-mark" aria-hidden="true">✓</div>
          <h2>反馈已提交</h2>
          <p>管理员已收到通知。反馈编号：<strong id="feedback-id"></strong></p>
          <button id="submit-another" type="button" class="secondary-button">继续提交</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
