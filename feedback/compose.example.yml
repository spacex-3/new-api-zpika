services:
  feedback:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ALLOWED_HOST: kf.example.com
      PUBLIC_ORIGIN: https://kf.example.com
      TRUST_CLOUDFLARE: "true"
      COOKIE_SECURE: "true"
      EMBED_PARENT_ORIGINS: https://api.example.com
    volumes:
      - feedback-data:/data
    secrets:
      - encryption_key
      - session_key
      - admin_token_hash
      - bootstrap_bark_url
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  encryption_key:
    file: ./secrets/encryption-key
  session_key:
    file: ./secrets/session-key
  admin_token_hash:
    file: ./secrets/admin-token-hash
  bootstrap_bark_url:
    file: ./secrets/bootstrap-bark-url

volumes:
  feedback-data:
