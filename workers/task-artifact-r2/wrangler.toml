name = "new-api-task-artifact-r2"
main = "src/index.js"
compatibility_date = "2026-11-10"

[[r2_buckets]]
binding = "ARTIFACT_BUCKET"
bucket_name = "zpika"

[vars]
INGEST_HMAC_KEY_ID = "v1"
MAX_ARTIFACT_BYTES = "1073741824"
ALLOWED_ORIGINS = "https://vip.zpika.com,https://vip-test.zpika.com"

# Set these with `wrangler secret put`, never in this file:
# INGEST_HMAC_SECRET
# MEDIA_HMAC_SECRET
# Optional rotation overlap:
# INGEST_HMAC_PREVIOUS_KEY_ID
# INGEST_HMAC_PREVIOUS_SECRET
