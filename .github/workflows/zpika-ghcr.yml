name: Publish Zpika Docker image (GHCR multi-arch)

on:
  push:
    branches:
      - main
    tags:
      - 'zpika-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  regression:
    name: Task and relay compatibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:test-only@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://postgres:test-only@127.0.0.1:5432/newapi_test?sslmode=disable
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Create frontend placeholder for backend tests
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Verify tasks and group visibility on SQLite, MySQL and PostgreSQL
        run: |
          go test -count=1 -v ./model -run '^TestUnfinishedTaskQueriesDatabaseMatrix$'
          go test -count=1 -v ./controller -run '^TestModelSquareGroupVisibility$'

      - name: Build and test relaykit independently
        working-directory: relaykit
        run: |
          go build ./...
          go test -count=1 -p 2 ./...

      - name: Verify tasks, billing, media, authentication and synchronous relay
        # Other packages initialize global database state for their own fixtures.
        # The external engines are used only by the explicit matrix above.
        run: |
          unset TEST_MYSQL_DSN TEST_POSTGRES_DSN
          go test -count=1 -p 2 ./model ./service ./controller ./middleware ./relay ./relay/common ./relay/helper ./relay/channel/task/jsplugin ./relay/channel/openai ./relay/channel/gemini ./relay/channel/claude ./router ./pkg/perf_metrics ./plugins ./pkg/jsplugin ./setting/system_setting

      - name: Verify AZ plugin and R2 worker
        run: |
          bun test plugins/az.test.js
          bun test workers/task-artifact-r2/src/index.test.js

  frontend-regression:
    name: Frontend types and group visibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Verify dashboard and public performance views
        run: bun run test src/features/performance-metrics/__tests__/summary.test.tsx

      - name: Lint and check formatting for performance views
        run: |
          bun x --no-install oxlint -c .oxlintrc.json src/features/performance-metrics/api.ts src/features/performance-metrics/__tests__/summary.test.tsx src/features/dashboard/components/models/performance-overview.tsx src/features/dashboard/components/overview/performance-health-panel.tsx
          bun x --no-install oxfmt --check src/features/performance-metrics/api.ts src/features/performance-metrics/__tests__/summary.test.tsx src/features/dashboard/components/models/performance-overview.tsx src/features/dashboard/components/overview/performance-health-panel.tsx

  build:
    needs: [regression, frontend-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
